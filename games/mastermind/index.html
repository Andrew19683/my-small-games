<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mastermind</title>
    <script type="module" crossorigin src="/my-small-games/assets/mastermind-CKi4YJUw.js"></script>
    <link rel="modulepreload" crossorigin href="/my-small-games/assets/modulepreload-polyfill-Dezn_h7o.js">
  </head>
  <body>
    <h1>Моя версия mastermind</h1>
    <p>WIP. Основные идеи еще не реализованы</p>
    <div class="game" id="game">
      <button id="submit">Готово</button>
      <div id="attempt-1">
        <input
          type="number"
          min="0"
          max="9"
          oninput="
            if (this.value.length > 1) this.value = this.value.slice(0, 1);
          "
          id="input-1-1"
        />
        <input
          type="number"
          min="0"
          max="9"
          oninput="
            if (this.value.length > 1) this.value = this.value.slice(0, 1);
          "
          id="input-1-2"
        />
        <input
          type="number"
          min="0"
          max="9"
          oninput="
            if (this.value.length > 1) this.value = this.value.slice(0, 1);
          "
          id="input-1-3"
        />
        <input
          type="number"
          min="0"
          max="9"
          oninput="
            if (this.value.length > 1) this.value = this.value.slice(0, 1);
          "
          id="input-1-4"
        />

        <span class="info-message" id="info-1"
          ><!-- Может быть текстом ошибки, если добавлен class "info-error" --></span
        >
      </div>
    </div>

    <dialog class="popup">
      <h2 id="popup-headline"></h2>
      <p id="popup-info"></p>
      <button id="reload">Играть</button>
      <button id="close">Закрыть</button>
    </dialog>

  </body>
</html>
